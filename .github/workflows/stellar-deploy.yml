name: Stellar AI Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stellar-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/david-yang-pixel/antigravity-tools-custom

jobs:
  quality:
    name: Quality checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: TypeScript type check
        run: npx tsc --noEmit
      - name: Deployment command safety and rollback tests
        run: python3 -m unittest discover -s deploy/stellar -p 'test_*.py'
      - name: Validate workflow definitions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/actionlint"
          gh release download v1.7.12 --repo rhysd/actionlint \
            -p actionlint_1.7.12_linux_amd64.tar.gz -p actionlint_1.7.12_checksums.txt \
            --dir "$RUNNER_TEMP/actionlint"
          cd "$RUNNER_TEMP/actionlint"
          sha256sum --check --ignore-missing actionlint_1.7.12_checksums.txt
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint/actionlint" -shellcheck= \
            .github/workflows/stellar-deploy.yml .github/workflows/ci.yml .github/workflows/deploy-pages.yml

  rust-quality:
    name: Rust Clippy and focused regression tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev pkg-config libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Provide placeholder frontend bundle
        run: |
          mkdir -p dist
          [ -f dist/index.html ] || echo '<html/>' > dist/index.html
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --lib --bin antigravity-tools
      - name: Focused regression tests
        working-directory: src-tauri
        run: |
          set -euo pipefail
          for filter in user_token proxy::middleware::monitor::tests; do
            cargo test --locked --lib "$filter" | tee "$RUNNER_TEMP/test-results"
            grep -Eq 'test result: ok\. [1-9][0-9]* passed;' "$RUNNER_TEMP/test-results"
          done

  build:
    name: Build and smoke-test image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read application version
        id: meta
        run: |
          set -euo pipefail
          # The [package] version is the first top-level `version =` and is what /health reports.
          version="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' src-tauri/Cargo.toml | head -n 1)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::Unexpected version '$version'"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: stellar-ai:test
          build-args: |
            USE_MIRROR=false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          # Registry cache uploads only layers it does not already hold, so the large
          # toolchain and compiled-dependency layers are written once per Cargo.lock change.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
      - name: Smoke test isolated container
        run: |
          set -euo pipefail
          export SMOKE_ADMIN="$(openssl rand -hex 24)"
          echo "::add-mask::$SMOKE_ADMIN"
          docker run -d --name stellar-smoke -p 127.0.0.1:18045:8045 \
            -e ABV_BIND_LOCAL_ONLY=false -e ABV_WEB_PASSWORD="$SMOKE_ADMIN" \
            -e ABV_API_KEY=ci-isolated-api-key stellar-ai:test
          trap 'docker rm -f stellar-smoke >/dev/null' EXIT
          python3 deploy/stellar/smoke.py http://127.0.0.1:18045
      - name: Publish verified image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            USE_MIRROR=false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache

  deploy:
    needs: [quality, rust-quality, build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://antigravity.smlershou.top/usage
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy pinned image through restricted SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ needs.build.outputs.digest }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/stellar_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/stellar_deploy' EXIT
          printf '%s\n' "$GHCR_TOKEN" | ssh -T -i ~/.ssh/stellar_deploy \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "root@$DEPLOY_HOST" "deploy $IMAGE@$DIGEST $REVISION"

  tag:
    name: Tag deployments
    # Runs only after a verified deployment; the write token stays out of the SSH job.
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Tag this and any untagged recent deployments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ needs.build.outputs.digest }}
        # deploy-YYYYMMDD-HHMM-<short commit> in Beijing time; also backfills deployments
        # from the last 30 days whose tag is missing. See deploy/stellar/README.md.
        run: python3 deploy/stellar/tag_deployments.py
