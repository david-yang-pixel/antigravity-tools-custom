name: Stellar AI Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stellar-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/david-yang-pixel/antigravity-tools-custom

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment recovery behavior
        run: python3 -m unittest discover -s deploy/stellar -p 'test_*.py'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Linux image and run focused Rust tests
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: stellar-ai:test
          build-args: |
            USE_MIRROR=false
            RUN_TESTS=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=stellar-amd64
          cache-to: type=gha,mode=max,scope=stellar-amd64
      - name: Smoke test isolated container
        run: |
          set -euo pipefail
          export SMOKE_ADMIN="$(openssl rand -hex 24)"
          echo "::add-mask::$SMOKE_ADMIN"
          docker run -d --name stellar-smoke -p 127.0.0.1:18045:8045 \
            -e ABV_BIND_LOCAL_ONLY=false -e ABV_WEB_PASSWORD="$SMOKE_ADMIN" \
            -e ABV_API_KEY=ci-isolated-api-key stellar-ai:test
          trap 'docker rm -f stellar-smoke >/dev/null' EXIT
          python3 deploy/stellar/smoke.py http://127.0.0.1:18045
      - name: Publish verified image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            USE_MIRROR=false
            RUN_TESTS=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=stellar-amd64

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://antigravity.smlershou.top/usage
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy pinned image through restricted SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ needs.build.outputs.digest }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/stellar_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/stellar_deploy' EXIT
          printf '%s\n' "$GHCR_TOKEN" | ssh -T -i ~/.ssh/stellar_deploy \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "root@$DEPLOY_HOST" "deploy $IMAGE@$DIGEST $REVISION"

