[package]
name = "boring-sys2"
version = "4.15.15"
edition = "2021"
license = "MIT"
publish = false
links = "boringssl"
build = "build/main.rs"

[features]
fips = []
fips-link-precompiled = []
pq-experimental = []
underscore-wildcards = []

[build-dependencies]
autocfg = "1.3"
bindgen = { version = "0.72", default-features = false, features = ["runtime"] }
cmake = "0.1.18"
fs_extra = "1.3"
fslock = "0.2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
sha2 = "0.10"
object = { version = "0.37", default-features = false, features = ["read", "std"] }

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = ['cfg(const_fn)', 'cfg(docsrs)']
