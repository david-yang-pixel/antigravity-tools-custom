[package]
name = "qoder-client"
version = "0.1.0"
edition = "2021"
publish = false
license = "CC-BY-NC-SA-4.0"

[dependencies]
async-stream = "0.3"
async-compression = { version = "0.4", features = ["tokio", "gzip", "zlib", "brotli"] }
base64 = "0.22"
bytes = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
openssl = { version = "=0.10.81", features = ["vendored"] }
# Keep the Node 22/24 OpenSSL 3.5 profile across all build hosts.
openssl-src = "=300.5.5"
percent-encoding = "2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "socks", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-openssl = "0.6"
tokio-socks = "0.5"
tokio-util = { version = "0.7", features = ["io"] }
tower-service = "0.3"
url = "2"
wasmi = { version = "1.1", default-features = false, features = ["std"] }
webpki-root-certs = "1"

[dev-dependencies]
tempfile = "3"
